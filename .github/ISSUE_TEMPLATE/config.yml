blank_issues_enabled: false
contact_links:
  - name: Ask a question (or claim an issue)
    url: https://github.com/ganeshmshetty/openclip/discussions
    about: General questions, workflow ideas, and "I'd like to work on this" — comment `/claim` on the issue itself to be assigned.
  - name: Propose, report, or fix an extension
    url: https://github.com/ganeshmshetty/openclip-extensions/issues/new/choose
    about: New extension ideas and bugs in existing extensions belong in the openclip-extensions catalog repo, not here.
  - name: Read the docs first
    url: https://github.com/ganeshmshetty/openclip/tree/main/docs
    about: Extension authoring, runtimes, architecture, and the developer guide. Your answer may already be documented.
